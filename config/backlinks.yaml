# Backlink publishing for hypnotreatment.uk (src/backlinks). Separate from the email outreach, which it never touches.
enabled: true
site_id: hypnotreatment-uk
brand_name: Hypnotreatment
state_dir: backlinks               # state/backlinks/
log_dir: backlinks                 # logs/backlinks/

# The goal, not a promise: only VERIFIED backlinks (a real link found on the live published page) count.
daily_target_verified: 2

# false = articles are saved as private drafts on the platform and wait in PENDING_APPROVAL, so you can read the
# first ones before anything goes public. true = publish immediately and verify the live page.
live_publishing: true    # hands-off: articles that pass every check are published and then verified (set to false for private drafts only)

limits:
  max_new_jobs_per_day: 4                  # attempts started per day while the target is not yet reached
  max_publications_per_platform_per_day: 2   # at most this many articles a day on one platform; a new account is held to 1 for ramp_days days first
  max_pending_approval: 3                  # while live_publishing is false: no new drafts once this many await your approval
  ramp_days: 0                               # 0 = no ramp: 2 articles a day from the start, as the owner asked (7 would hold a new account to 1 a day for a week)
  max_retries: 3
  retry_backoff_hours: [1, 6, 24]
  stuck_after_minutes: 30                  # SUBMISSION_IN_PROGRESS longer than this is checked for a crash
  verify_recheck_days: [1, 7, 30]          # a verified link is re-checked this many days after it was verified
  verify_failures_before_inaccessible: 3

# Our own counters (providers differ in what they report). Stay well inside each free tier.
quotas:
  tavily_searches_per_month: 300      # 3 sites share ~1,000 free credits a month; the providers' own numbers are checked too
  firecrawl_scrapes_per_month: 300
  tavily_searches_per_day: 8          # the owner's daily limit for this site: 3 sites x 8 = 24 a day, at most about 740 a month of the 1,000 free
  firecrawl_scrapes_per_day: 4        # most pages read through Firecrawl per site per day (only used on alternate days)
  gemini_calls_per_day: 80
  gemini_patience_seconds: [60, 120]       # when Gemini is busy or rate-limited: wait this long between rounds
  gemini_wait_budget_seconds: 300          # the owner's cap (2026-11-02): at most 5 minutes lost to Gemini trouble per website per run

discovery:
  new_candidates_per_run: 25               # every day: new pages found with "write for us" style searches (Tavily)
  inspect_per_run: 25                      # pages checked per run (plain fetch is free; Gemini is asked only about pages with a usable form)
  firecrawl_scrapes_per_run: 4

verification:
  canonical_hosts: ["hypnotreatment.uk", "www.hypnotreatment.uk"]

# Publication routes confirmed against the platform's own documentation. A site without an adapter is recorded
# as UNSUPPORTED_PUBLICATION_METHOD with the reason, never attempted.
# Guest posts (src/backlinks/guestposts.py): websites in the niche that accept outside articles and links, through their own form.
# submit: false = review mode (everything found, checked and written, nothing sent). The owner turns it on after looking.
# brief: what Gemini is told about the writer and the readers for every guest article (and for new topic ideas).
# search_words: the niche words combined with "write for us", "submit a guest post" and so on (any country; Gemini judges the fit).
guest_posts:
  submit: true
  author: "Shahin Gurbanov"
  bio: "Shahin Gurbanov is a qualified hypnotherapist in London and runs [Hypnotreatment]({home}), with sessions in person in London and online by video."
  brief: >-
    Shahin Gurbanov is a qualified hypnotherapist in London who works with hypnotherapy, NLP and ideas from CBT. The readers are adults
    dealing with stress, anxiety, poor sleep, low confidence, fears or unwanted habits, and people curious about how the mind works.
    Voice: calm, warm and plain, like an experienced practitioner explaining things to a client; never preachy, dramatic or salesy.
    Explain simply what is happening in the mind and body, then give small steps the reader can try today, such as a breathing
    exercise, a wind-down routine, noticing and questioning a thought, or a short visualisation. Suggest seeing a GP or another health
    professional when problems are severe, long-lasting or include thoughts of self-harm. Never diagnose, and never present
    hypnotherapy as a cure or a replacement for medical care.
  search_words: ["mental health", "wellbeing", "anxiety", "stress management", "mindfulness", "self improvement",
                 "personal development", "sleep", "psychology", "wellness", "hypnotherapy", "life coaching"]

# Statements the articles may make about Hypnotreatment. Anything else about it is rejected by the fact check.
facts:
  - "Hypnotreatment is the hypnotherapy practice of Shahin Gurbanov, a qualified hypnotherapist in London."
  - "Sessions are available in person in London and online by video."
  - "Hypnotreatment offers a free video consultation."
  - "Shahin uses hypnotherapy with NLP and ideas from cognitive behavioural therapy (CBT)."
  - "Hypnotreatment has an AI Hypnotherapist: it gives a personal consultation, listens to the person's answers, then writes and records a hypnotherapy session made for that person."
  - "The AI Hypnotherapist uses the techniques professional hypnotherapists use, including Ericksonian hypnosis, NLP and ideas from CBT, and follows the method of Shahin, a qualified hypnotherapist."
  - "Safety comes first in the AI Hypnotherapist: every client completes a safety screening before a consultation begins, and during the consultation it asks safety questions again to check the person is not at risk."

