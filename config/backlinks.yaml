# Wording the articles must never use: outcome guarantees and medical claims we cannot support.
banned_claims:
  - "cure"
  - "cures"
  - "guarantee"
  - "guaranteed"
  - "100%"
  - "clinically proven"
  - "scientifically proven"
  - "proven to"
  - "miracle"
  - "stop taking your medication"
  - "instead of medication"
  - "replace your medication"
  - "no side effects"
  - "permanently remove"

# Keeps the topics fresh: when fewer than `when_unused_below` unused topics are left, Gemini proposes `count` new ones.
# A proposal may only link to one of these pages, must take a clearly different angle from everything already written,
# and must use link texts nobody has used. Depression, PTSD, addiction, migraines and stammering pages are left out on purpose: too medical.
topic_generation:
  enabled: true
  when_unused_below: 4
  count: 6
  allowed_targets:
    - url: "https://www.hypnotreatment.uk/treatments/anxiety"
      about: "hypnotherapy for anxiety"
    - url: "https://www.hypnotreatment.uk/treatments/insomnia"
      about: "hypnotherapy for insomnia and sleep"
